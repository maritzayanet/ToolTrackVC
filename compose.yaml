
services:
  tooltrack:
    image: ghcr.io/maritzayanet/tooltrack:latest
    container_name: tooltrack-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: ${DOCKER_DB_CONNECTION}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__Key: ${JWT_KEY}
      Jwt__Username: ${JWT_USERNAME}
      Jwt__Password: ${JWT_PASSWORD}